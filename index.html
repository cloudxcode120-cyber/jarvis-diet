<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04101a">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Jarvis Diet">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}body{margin:0}[hidden]{display:none!important}</style>
<title>Jarvis Power Diet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-height HUD console. Top bar + tab row, one active view fills the rest; Jarvis orb floats above everything. */
:root{
  --bg:#04101a; --panel:#08202e; --panel2:#0b2a3b; --line:#14506b;
  --cy:#38e8ff; --cyd:#1aa8c4; --gold:#ffb347; --fg:#d6f6ff; --mute:#7fb2c4;
  --ok:#5dffb0; --bad:#ff7a7a;
  --cys:rgba(56,232,255,.08); --golds:rgba(255,179,71,.10);
  --display:'Orbitron','Rajdhani',system-ui,sans-serif;
  --body:'Rajdhani','Noto Sans Devanagari',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:500 17px/1.45 var(--body);overflow:hidden;
  background-image:linear-gradient(rgba(56,232,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(56,232,255,.04) 1px,transparent 1px);background-size:32px 32px}
button,input,textarea{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:rgba(4,16,26,.92)}
.bar h1{margin:0;font:700 13px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;flex:1;min-width:0}
.bar .on{font:500 10px var(--display);letter-spacing:.15em;color:var(--ok);display:flex;align-items:center;gap:6px}
.bar .on::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
.nav{display:flex;border-bottom:1px solid var(--line)}
.nav button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;font:500 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);cursor:pointer;min-width:0}
.nav button.act{color:var(--cy);border-bottom-color:var(--cy);text-shadow:0 0 10px var(--cy)}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding:16px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.view.talk{display:flex;flex-direction:column;padding-bottom:0}
#log{flex:1;overflow:auto;max-width:720px;width:100%;margin:0 auto;padding-bottom:8px}
#dock{max-width:720px;width:100%;margin:0 auto;padding:10px 0 14px;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line)}
.b{max-width:90%;padding:9px 14px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .25s ease}
.b.j{border-left:2px solid var(--cy);background:var(--cys)}
.b.u{margin-left:auto;border-right:2px solid var(--gold);background:var(--golds);text-align:right}
.btn,.chip{cursor:pointer;border:1px solid var(--cyd);background:var(--cys);color:var(--fg);padding:10px 16px;
  font:600 14px var(--display);letter-spacing:.06em;text-transform:uppercase;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.chip{font:600 16px var(--body);text-transform:none;letter-spacing:0;padding:9px 14px}
.btn:hover,.chip:hover{background:rgba(56,232,255,.18)}
.btn.pri{background:var(--cy);color:#02222c;border-color:var(--cy)}
.chip[aria-pressed=true]{background:var(--cy);color:#02222c}
.btn.bad{border-color:var(--bad);color:var(--bad)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.inrow{display:flex;gap:8px;width:100%;flex-wrap:wrap}
input[type=text],input[type=number],textarea{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);padding:10px 12px;color:var(--fg)}
textarea{width:100%;min-height:70px}
.err{width:100%;color:var(--bad);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px 16px;min-width:0}
.eyebrow{font:500 10px var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--cy)}
h2{margin:0;font:700 22px/1.2 var(--display);text-wrap:balance}
h3{margin:0 0 8px;font:700 13px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
p{margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{border:1px solid var(--line);padding:10px 12px;background:var(--panel2)}
.stat b{display:block;font:700 22px var(--display);font-variant-numeric:tabular-nums;color:var(--cy)}
.stat span{font-size:13px;color:var(--mute)}
.big{cursor:pointer;text-align:left;border:1px solid var(--cyd);background:var(--panel2);padding:16px;display:flex;flex-direction:column;gap:6px;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.big:hover{background:#0f3850}
.big b{font:700 17px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--cy)}
.big span{color:var(--mute);font-size:15px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.meals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.meal{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.meal:last-child{border:0}
.tm{font:500 12px var(--display);color:var(--gold);width:48px;flex:none;padding-top:3px;font-variant-numeric:tabular-nums}
.mb{min-width:0;display:flex;flex-direction:column}
.mb em{font:normal 600 12px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.mb b{font-weight:700;font-size:18px}
.mb small{color:var(--mute);font-size:14px}
ul.pts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:15px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{font:500 10px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--line)}
.muted{color:var(--mute)}
svg text{fill:var(--mute);font:11px var(--display)}
.ln{fill:none;stroke:var(--cy);stroke-width:2}
.gr{stroke:var(--line);stroke-width:1}
.dot{fill:var(--gold)}
/* orb */
.orb{position:fixed;width:72px;height:72px;z-index:60;cursor:grab;touch-action:none;filter:drop-shadow(0 0 10px var(--cy));transition:left 3s ease-in-out,top 3s ease-in-out;background:none;border:0;padding:0}
.orb.drag{transition:none;cursor:grabbing}
.orb[hidden]{display:none}
.tab{position:fixed;right:0;top:45%;z-index:60;border:1px solid var(--cy);border-right:0;background:var(--panel);color:var(--cy);font:700 12px var(--display);padding:12px 8px;cursor:pointer;writing-mode:vertical-rl;letter-spacing:.2em}
.panel{position:fixed;right:0;bottom:0;width:min(420px,100%);height:min(72%,540px);z-index:70;background:rgba(4,16,26,.97);border:1px solid var(--cy);display:flex;flex-direction:column;box-shadow:0 0 30px rgba(56,232,255,.25)}
.panel[hidden]{display:none}
.panel header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.panel header b{flex:1;font:700 12px var(--display);letter-spacing:.18em}
.panel header button{background:none;border:1px solid var(--line);padding:4px 10px;cursor:pointer;font-size:13px}
#olog{flex:1;overflow:auto;padding:8px 12px}
.panel .inrow{padding:8px 12px;border-top:1px solid var(--line);flex-wrap:nowrap}
.modal{position:fixed;inset:0;z-index:90;background:rgba(2,8,14,.85);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal .card{max-width:420px;display:flex;flex-direction:column;gap:12px;border-color:var(--cy)}
#boot{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#boot[hidden]{display:none}
#boot h1{margin:0;font:900 clamp(22px,6vw,38px)/1.1 var(--display);letter-spacing:.2em;text-transform:uppercase;text-shadow:0 0 18px var(--cy)}
#boot p{color:var(--mute);font:500 12px var(--display);letter-spacing:.2em}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:95;background:var(--panel2);border:1px solid var(--cy);padding:8px 16px;font-size:15px;max-width:90%}
#toast[hidden]{display:none}
.spin{animation:spin 20s linear infinite;transform-origin:50px 50px}
.spin2{animation:spin 12s linear infinite reverse;transform-origin:50px 50px}
.glow{animation:pulse 2.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.45}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.blink{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
.mouth{transform-box:fill-box;transform-origin:center}
.speaking .mouth{animation:talk .22s ease-in-out infinite alternate}
.speaking .orb{filter:drop-shadow(0 0 18px var(--cy))}
#pav{display:inline-flex}
.chip.rec,.btn.rec{background:var(--bad);color:#2a0505;border-color:var(--bad)}
select{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);padding:10px 12px;color:var(--fg)}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(.6)}to{transform:scaleY(3.4)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head><body>
<div id="boot">
  <div id="bootlogo"></div>
  <h1>Jarvis Power Diet</h1>
  <p id="bootsub">NUTRITION CORE · STANDBY</p>
  <button class="btn pri" id="bootbtn" data-act="activate">Activate</button>
</div>

<div id="app">
  <div class="bar"><span id="barlogo"></span><h1>Jarvis Power Diet</h1><span class="on" data-k="online">Online</span></div>
  <nav class="nav">
    <button data-act="go:home" data-v="home" data-k="home">Home</button>
    <button data-act="go:plan" data-v="plan" data-k="plan">Plan</button>
    <button data-act="go:rec" data-v="rec" data-k="rec">Records</button>
    <button data-act="go:set" data-v="set" data-k="set">Settings</button>
  </nav>
  <main>
    <section class="view" id="v-home"></section>
    <section class="view talk" id="v-talk" hidden><div id="log" aria-live="polite"></div><div id="dock"></div></section>
    <section class="view" id="v-plan" hidden></section>
    <section class="view" id="v-rec" hidden></section>
    <section class="view" id="v-set" hidden></section>
  </main>
</div>

<button class="orb" id="orb" hidden aria-label="Jarvis"></button>
<button class="tab" id="otab" hidden data-act="orbshow">JARVIS</button>
<div class="panel" id="panel" hidden>
  <header><span id="pav"></span><b>JARVIS POWER</b><button data-act="orbclose" data-k="min">Minimise</button><button data-act="orbhide" data-k="hide">Hide</button></header>
  <div id="olog"></div>
  <div class="inrow"><input type="text" id="oin" autocomplete="off"><button class="chip" id="omic" data-k="mic">Mic</button><button class="btn pri" id="osend" data-act="osend">Send</button></div>
</div>
<div class="modal" id="modal" hidden><div class="card" id="modalbox"></div></div>
<div id="toast" hidden></div>

<script>
'use strict';
/* ===== helpers & state ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const KEY='jpd.v1';
let memDB=null, storeOK=true;
const fresh=()=>({profile:null,days:{},weeks:{},settings:{save:true,voice:false,sound:false,mic:false,roam:true},orb:{x:null,y:null,hidden:false}});
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){storeOK=false}return memDB}
let DB=load()||fresh();
function save(){memDB=DB;if(DB.settings.save===false)return;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){storeOK=false}}
const ymd=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const lang=()=>DB.profile?.lang||'hn';
function sir(){const g=DB.profile?.gender;if(!g)return'';const hi=lang()==='hi';return g==='f'?(hi?'मैम':"Ma'am"):(hi?'सर':'Sir')}
function ad(){const p=DB.profile;if(!p?.name)return'';return p.name+(sir()?' '+sir():'')}
function T(o){let s=o[lang()]??o.hn??o.en??'';return s.replaceAll('{n}',ad()).replaceAll('{name}',DB.profile?.name||'')}
function fmtDate(s,long){const d=new Date(s+'T12:00:00');return d.toLocaleDateString(lang()==='hi'?'hi-IN':'en-IN',long?{weekday:'long',day:'numeric',month:'short'}:{weekday:'short',day:'numeric',month:'short'})}
let toastT;
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2600)}

/* ===== reactor logo ===== */
function reactor(size){
  let ticks='';for(let i=0;i<24;i++){const a=i*15*Math.PI/180;ticks+=`<line x1="${50+43*Math.cos(a)}" y1="${50+43*Math.sin(a)}" x2="${50+47*Math.cos(a)}" y2="${50+47*Math.sin(a)}" stroke="#38e8ff" stroke-width="1.5"/>`}
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
  <g class="spin">${ticks}<circle cx="50" cy="50" r="40" fill="none" stroke="#38e8ff" stroke-width="2" stroke-dasharray="14 6"/></g>
  <g class="spin2"><circle cx="50" cy="50" r="31" fill="none" stroke="#ffb347" stroke-width="1.5" stroke-dasharray="4 5"/></g>
  <circle cx="50" cy="50" r="24" fill="rgba(56,232,255,.12)" stroke="#38e8ff" stroke-width="2"/>
  <polygon class="glow" points="50,33 65,59 35,59" fill="rgba(56,232,255,.35)" stroke="#d6f6ff" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="50" cy="50" r="5" fill="#d6f6ff" class="glow"/></svg>`}

/* ===== sound ===== */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f1,f2,dur,type='sine',vol=.05,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03)}
function sfx(k){if(!DB.settings.sound)return;
  if(k==='click'){tone(1500,2300,.07,'square',.02);tone(700,1100,.09,'sine',.04,.02)}
  else if(k==='confirm'){tone(600,900,.12,'sine',.05);tone(900,1350,.14,'sine',.05,.1);tone(1350,1800,.2,'sine',.04,.2)}
  else if(k==='open'){tone(400,1200,.18,'triangle',.05)}
  else if(k==='err'){tone(320,160,.25,'sawtooth',.04)}
  else if(k==='boot'){tone(90,1600,.9,'sawtooth',.03);tone(800,1600,.15,'sine',.05,.8);tone(1200,2400,.3,'sine',.04,.95)}}
document.addEventListener('click',e=>{if(e.target.closest('button'))sfx('click')},true);

/* ===== Jarvis avatar (male / female hologram bust) ===== */
function avatar(g,size){const f=g==='f';let sc='';for(let y=10;y<92;y+=4)sc+=`<line x1="8" x2="92" y1="${y}" y2="${y}" stroke="#38e8ff" stroke-opacity=".10"/>`;
  const hair=f?`<path d="M34 42C30 18 70 18 66 42C70 56 71 66 65 76L59 69C61 58 60 45 60 38C54 33 46 33 40 38C40 45 39 58 41 69L35 76C29 66 30 56 34 42Z" fill="rgba(56,232,255,.38)" stroke="#38e8ff" stroke-width="1.2"/>`
    :`<path d="M36 40C34 22 66 22 64 40C61 33 56 30 50 30C44 30 39 33 36 40Z" fill="rgba(56,232,255,.42)" stroke="#38e8ff" stroke-width="1.2"/>`;
  const extra=f?`<circle cx="36" cy="47" r="1.3" fill="#ffb347"/><circle cx="64" cy="47" r="1.3" fill="#ffb347"/><path d="M40 40.2L38.5 39M60 40.2L61.5 39" stroke="#d6f6ff" stroke-width=".8"/>`:`<path d="M37 40L37 48M63 40L63 48" stroke="#38e8ff" stroke-width=".8" stroke-opacity=".6"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
  <circle cx="50" cy="50" r="46" fill="#06202c" stroke="#38e8ff" stroke-width="2"/>
  <g class="spin"><circle cx="50" cy="50" r="48.5" fill="none" stroke="#ffb347" stroke-width="1" stroke-dasharray="3 6"/></g>
  <path d="M14 75C20 66 34 63 50 63C66 63 80 66 86 75A44 44 0 0 1 14 75Z" fill="#0b3a4d" stroke="#38e8ff" stroke-width="1.5"/>
  <path d="M40 65L50 77L60 65" fill="none" stroke="#38e8ff" stroke-width="1.3"/>
  <circle cx="50" cy="82" r="3.6" fill="#d6f6ff" class="glow"/><circle cx="50" cy="82" r="6" fill="none" stroke="#38e8ff" stroke-width="1"/>
  <rect x="44" y="55" width="12" height="11" fill="#0e4a60"/>
  <ellipse cx="50" cy="42" rx="14" ry="17" fill="#12566f" stroke="#38e8ff" stroke-width="1.5"/>
  ${hair}${extra}
  <ellipse class="blink" cx="43.5" cy="42" rx="2.6" ry="1.5" fill="#d6f6ff"/><ellipse class="blink" cx="56.5" cy="42" rx="2.6" ry="1.5" fill="#d6f6ff"/>
  <path d="M50 44L48.7 49.5L51.3 49.5" fill="none" stroke="#38e8ff" stroke-opacity=".7" stroke-width=".9"/>
  <ellipse class="mouth" cx="50" cy="53.5" rx="4" ry="1" fill="${f?'#ffb347':'#38e8ff'}"/>
  ${sc}</svg>`}

/* ===== voice ===== */
function voiceGender(v){const n=v.name;if(/female|zira|heera|swara|neerja|priya|samantha|susan|hazel|kalpana|aria|jenny|emma|karen|veena|tessa|lekha|natasha|libby|sonia/i.test(n))return'f';
  if(/(^|[^a-z])male|david|daniel|mark|ravi|hemant|prabhat|rishi|james|george|guy|ryan|alex|madhur|prabhas|ryan/i.test(n))return'm';return null}
function pickVoice(){if(!window.speechSynthesis)return null;const vs=speechSynthesis.getVoices();if(!vs.length)return null;
  const sv=DB.settings.voiceURI;if(sv){const f=vs.find(v=>v.voiceURI===sv);if(f)return f}
  const hi=lang()==='hi',g=DB.profile?.gender;const pool=vs.filter(v=>v.lang.toLowerCase().startsWith(hi?'hi':'en'));if(!pool.length)return null;
  const sc=v=>{let s=0;if(voiceGender(v)===g)s+=4;else if(voiceGender(v))s-=3;if(/google|neural|natural|online|network/i.test(v.name+v.voiceURI)||v.localService===false)s+=2;if(/^(hi-IN|en-IN)$/i.test(v.lang))s+=1;return s};
  return pool.map(v=>[sc(v),v]).sort((a,b)=>b[0]-a[0])[0][1]}
let spk=0;
function speak(text,cancel){if(!DB.settings.voice||!('speechSynthesis' in window))return;
  try{if(cancel){speechSynthesis.cancel();spk=0;document.body.classList.remove('speaking')}
    const u=new SpeechSynthesisUtterance(String(text).replace(/[\u{1F300}-\u{1FAFF}•·→]/gu,' ').slice(0,300));
    u.lang=lang()==='hi'?'hi-IN':'en-IN';const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}
    const g=DB.profile?.gender,match=v&&voiceGender(v)===g;u.pitch=match?1:(g==='f'?1.12:g==='m'?.9:1);u.rate=.96;
    u.onstart=()=>{spk++;document.body.classList.add('speaking')};const end=()=>{spk=Math.max(0,spk-1);if(!spk)document.body.classList.remove('speaking')};u.onend=end;u.onerror=end;
    speechSynthesis.speak(u)}catch(e){}}
let recog=null;
function listen(onText,onErr,onState){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return onErr('unsupported');

function weightSeries(){const m={},p=DB.profile;if(p?.joined&&p.weight0)m[p.joined]=p.weight0;

/* targets with adaptation */
function adjustFor(goal,date){const p=DB.profile,ins=[];if(!p.adj||p.adj.goal!==goal)p.adj={goal,val:0,at:null};
  const s=slope(date);
  if(s!=null){const sg=(s>0?'+':'')+s.toFixed(1);
    ins.push({en:`Weight trend: ${sg} kg per week.`,hi:`वज़न का रुझान: ${sg} किलो प्रति सप्ताह।`,hn:`Weight trend: ${sg} kg per week.`});
    if(!p.adj.at||daysBetween(p.adj.at,date)>=6){let ch=0;
      if(goal==='loss'){if(s>-0.1)ch=-120;else if(s<-1)ch=150}else{if(s<0.05)ch=150;else if(s>0.8)ch=-150}
      if(ch){p.adj.val=clamp(p.adj.val+ch,-400,400);p.adj.at=date;const t=(ch>0?'+':'')+ch;
        ins.push({en:`Your progress was off target, so I changed calories by ${t}.`,hi:`आपकी प्रगति लक्ष्य से अलग थी, इसलिए कैलोरी ${t} बदली गई।`,hn:`Aapki progress target se alag thi, isliye calories ${t} change ki gayi.`})}}}
  return{val:p.adj.val,ins}}
function lowEnergy(date){const r=[1,2,3].map(i=>DB.days[addDays(date,-i)]).filter(x=>x&&x.energy);return r.length>=2&&r.every(x=>x.energy<=2)}
function targetFor(o){const p=DB.profile,w=o.weight||p.weight,male=p.gender==='m';
  const bmr=10*w+6.25*p.height-5*p.age+(male?5:-161);
  const af={low:1.3,mod:1.5,high:1.7}[o.activity||p.activity]||1.4;let t=bmr*af;
  let delta={loss:-450,gain:400,muscle:300,glow:300}[o.goal]||0;
  if(p.age<18&&o.goal==='loss')delta=-150;
  if(o.health==='sick'){t*=.9;delta=Math.min(delta,0)}
  const a=adjustFor(o.goal,o.date);const ins=[...a.ins];
  let extra=0;if(lowEnergy(o.date)){extra=100;ins.push({en:'Your energy was low for a few days, so I added 100 kcal.',hi:'कुछ दिनों से आपकी ऊर्जा कम थी, इसलिए 100 कैलोरी जोड़ी।',hn:'Kuch dinon se aapki energy low thi, isliye 100 kcal add ki.'})}
  const floor=p.age<18?1800:male?1500:1200;
  const kcal=Math.round(clamp(t+delta+a.val+extra,floor,5000)/10)*10;
  const pr={loss:1.6,gain:1.4,muscle:1.9,glow:1.3}[o.goal]||1.4;
  return{kcal,protein:Math.round(w*pr),water:(Math.round(w*35/100)/10).toFixed(1),ins}}

/* pick & portion */
function pickDish(slot,c,goal,rng,recent,bad){
  let pool=D.filter(d=>d.s===slot&&allowed(d,c,false));
  if(c.light){const l=pool.filter(d=>d.f.includes('l'));if(l.length)pool=l}
  if(!pool.length)pool=D.filter(d=>d.s===slot&&allowed(d,c,true));
  if(!pool.length)pool=D.filter(d=>d.s===slot);
  const sc=d=>{let s=rng()*2;if(c.wish.some(t=>kwOf(d).includes(t)))s+=6;if(recent.includes(d.id))s-=5;
    if(goal==='loss'&&d.f.includes('f'))s-=3;if(goal==='muscle')s+=d.p/d.k*40;
    if((goal==='gain'||goal==='glow')&&d.f.includes('g'))s+=2.5;if(c.light&&d.f.includes('l'))s+=3;if(bad&&d.f.includes('l'))s+=2;return s};
  return pool.map(d=>[sc(d),d]).sort((a,b)=>b[0]-a[0])[0][1]}
function buildMeals(o,kcal,rng,recent){const c=ctxOf(o),slots=o.meals===5?SL5:SL3,used=[...recent],out=[];
  slots.forEach(([s,share,time])=>{const d=pickDish(s,c,o.goal,rng,used,o.bad);used.push(d.id);c.wish=c.wish.filter(t=>!kwOf(d).includes(t));
    let v=d.q*clamp(kcal*share/d.k,.5,2.5);v=d.q>=2?Math.max(1,Math.round(v)):Math.max(.5,Math.round(v*2)/2);
    const m=v/d.q;out.push({slot:s,time,id:d.id,qty:v,k:Math.round(d.k*m),p:Math.round(d.p*m)})});
  return out}

function notesFor(o,pl){const p=DB.profile,c=p.conds||[],n=[NT.water(pl.water),NT[o.goal]];
  ['sugar','bp','acid','thyroid','other'].forEach(k=>{if(c.includes(k))n.push(NT[k])});
  if(o.health==='sick')n.push(NT.sick);if(o.sleep&&o.sleep<6)n.push(NT.sleep);if(p.age<18)n.push(NT.minor);
  const miss=tokens(o.wishes).filter(t=>!D.some(d=>kwOf(d).includes(t))).slice(0,2);
  miss.forEach(t=>n.push({en:`"${t}" is not in my food list yet, so I picked close options.`,hi:`"${t}" अभी मेरी खाने की सूची में नहीं है, इसलिए मिलते-जुलते विकल्प चुने।`,hn:`"${t}" abhi meri food list me nahi hai, isliye milte-julte options chune.`}));
  n.push(NT.disc);return n}
function genPlan(o,tg,rng,recent){const meals=buildMeals(o,tg.kcal,rng,recent);
  const pl={date:o.date,goal:o.goal,target:tg.kcal,protein:tg.protein,water:tg.water,meals,total:meals.reduce((a,m)=>a+m.k,0),got:meals.reduce((a,m)=>a+m.p,0)};
  pl.notes=notesFor(o,pl);return pl}

let FID=0,pending=null;
function bubble(who,text,box){const b=document.createElement('div');b.className='b '+who;b.textContent=text;(box||$('#log')).appendChild(b);(box||$('#log')).scrollTop=1e9;return b}
async function say(o){const t=typeof o==='string'?o:T(o);bubble('j',t);speak(t);sfx('open');await sleep(350)}
function abortFlow(){if(pending){pending.rej('abort');pending=null}}
async function runFlow(fn){abortFlow();const id=++FID;try{await fn(id)}catch(e){if(e!=='abort')console.error(e)}}
async function ask(c){const id=FID;await say(c.q);if(id!==FID)throw'abort';
  return new Promise((res,rej)=>{pending={rej};const dock=$('#dock');dock.innerHTML='';
    const done=(v,label)=>{pending=null;try{speechSynthesis.cancel()}catch(e){}bubble('u',label);dock.innerHTML='';sfx('confirm');res(v)};
    if(c.type==='choice'){c.opts.forEach(o=>{const b=document.createElement('button');b.className='chip';b.textContent=T(o.l);b.onclick=()=>done(o.v,T(o.l));dock.appendChild(b)});return}
    if(c.type==='multi'){const sel=new Set(c.def||[]);c.opts.forEach(o=>{const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',String(sel.has(o.v)));b.textContent=T(o.l);
      b.onclick=()=>{if(sel.has(o.v)){sel.delete(o.v)}else{if(o.x)sel.clear();else c.opts.filter(z=>z.x).forEach(z=>sel.delete(z.v));sel.add(o.v)}
        $$('.chip',dock).forEach((e,i)=>e.setAttribute('aria-pressed',sel.has(c.opts[i].v)))};dock.appendChild(b)});
      const ok=document.createElement('button');ok.className='btn pri';ok.textContent=T(X.conf);
      ok.onclick=()=>done([...sel],[...sel].map(v=>T(c.opts.find(o=>o.v===v).l)).join(', ')||'-');dock.appendChild(ok);return}
    const row=document.createElement('div');row.className='inrow';const inp=document.createElement('input');
    const num=c.type==='num';inp.type=num?'number':'text';if(num){inp.inputMode='decimal';inp.step='any'}inp.placeholder=c.ph?T(c.ph):'';inp.autocomplete='off';
    const err=document.createElement('div');err.className='err';err.hidden=true;
    const go=()=>{const raw=inp.value.trim();if(!raw){if(c.skip)return done(null,T(X.skip));return}
      if(num){const v=parseFloat(raw.replace(',','.'));if(isNaN(v)||v<c.min||v>c.max){err.textContent=T({en:`Please enter a number between ${c.min} and ${c.max}.`,hi:`कृपया ${c.min} से ${c.max} के बीच संख्या लिखें।`,hn:`Please ${c.min} se ${c.max} ke beech number likhein.`});err.hidden=false;sfx('err');return}done(v,String(v))}else done(raw.slice(0,120),raw.slice(0,120))};
    inp.onkeydown=e=>{if(e.key==='Enter')go()};const ok=document.createElement('button');ok.className='btn pri';ok.textContent=T(X.ok);ok.onclick=go;row.append(inp,ok);
    if(!num){const m=document.createElement('button');m.className='chip';m.textContent=T({en:'Mic',hi:'माइक',hn:'Mic'});m.onclick=()=>doMic(t=>{inp.value=t},m);row.appendChild(m)}
    if(c.skip){const s=document.createElement('button');s.className='chip';s.textContent=T(X.skip);s.onclick=()=>done(null,T(X.skip));row.appendChild(s)}
    dock.append(row,err);inp.focus()})}

function chartSVG(pts){if(pts.length<2)return`<p class="muted">${esc(T({en:'Add your weight in two or more check-ins to see the trend.',hi:'ट्रेंड देखने के लिए दो या अधिक चेक-इन में वज़न लिखें।',hn:'Trend dekhne ke liye do ya zyada check-in me weight likhein.'}))}</p>`;

function orbPos(x,y){const m=8,maxx=innerWidth-72-m,maxy=innerHeight-72-m;orb.style.left=clamp(x,m,maxx)+'px';orb.style.top=clamp(y,m+60,maxy)+'px'}

  orbPos(DB.orb.x??innerWidth-80,DB.orb.y??innerHeight-150)}
let dsx,dsy,dox,doy,moved;
orb.addEventListener('pointerdown',e=>{dragging=true;moved=false;dsx=e.clientX;dsy=e.clientY;const r=orb.getBoundingClientRect();dox=r.left;doy=r.top;orb.classList.add('drag');orb.setPointerCapture(e.pointerId)});
orb.addEventListener('pointermove',e=>{if(!dragging)return;if(Math.abs(e.clientX-dsx)+Math.abs(e.clientY-dsy)>6)moved=true;if(moved)orbPos(dox+e.clientX-dsx,doy+e.clientY-dsy)});
orb.addEventListener('pointerup',()=>{dragging=false;orb.classList.remove('drag');lastTouch=Date.now();
  if(moved){const r=orb.getBoundingClientRect();DB.orb.x=r.left;DB.orb.y=r.top;save()}else togglePanel()});

  const pool=D.filter(d=>d.s===s&&allowed(d,c,false));const d=pool[Math.floor(Math.random()*pool.length)]||D.find(x=>x.s===s);return d}

function appReply(t){const m=r=>r.test(t);
  if(m(/hide|chup|chhup|band kar|hatao|छुप|हटाओ/)){hideOrb();return null}
  if(m(/weekly|week|hafte|haftey|वीकली|साप्ताहिक|हफ़्ते|हफ्ते/)){go('talk');runFlow(weeklyFlow);return{en:'Starting the weekly plan.',hi:'वीकली प्लान शुरू कर रहा हूँ।',hn:'Weekly plan shuru kar raha hoon.'}}
  if(m(/daily|aaj ka|डेली|आज का/)){go('talk');runFlow(dailyFlow);return{en:'Starting your daily check-in.',hi:'डेली चेक-इन शुरू कर रहा हूँ।',hn:'Daily check-in shuru kar raha hoon.'}}
  if(m(/show.*plan|plan dikh|plan dekh|प्लान दिखा|प्लान देख/)){go('plan');return{en:'Here is your plan.',hi:'यह रहा आपका प्लान।',hn:'Ye raha aapka plan.'}}
  if(m(/kya kha|what.*eat|hungry|bhookh|भूख|क्या खा/)){const d=suggestDish();return{en:`Try: ${d.n} (about ${d.k} kcal).`,hi:`यह आज़माइए: ${d.h} (लगभग ${d.k} कैलोरी)।`,hn:`Ye try karein: ${d.n} (lagbhag ${d.k} kcal).`}}
  if(m(/who are you|tum kaun|aap kaun|कौन हो|कौन हैं/))return R.who;
  if(m(/(mera|my) (naam|name)|मेरा नाम/))return R.name;
  if(m(/protein|प्रोटीन/))return R.protein;
  if(m(/water|pani|paani|पानी/))return R.water;
  if(m(/muscle|gym|bodybuild|मसल/))return R.muscle;
  if(m(/face|chehra|glow|skin|चेहरा|त्वचा|bhara|भरा/))return R.glow;
  if(m(/gain|badhana|vajan badh|weight badh|dubla|वज़न बढ़|वजन बढ़|दुबला/))return R.gain;
  if(m(/loss|lose|patla|kam karna|vajan kam|fat|mota|motapa|वज़न घट|वजन घट|मोटा/))return R.loss;
  if(m(/sleep|neend|नींद/))return R.sleep;
  if(m(/time|samay|baje|समय/))return R.time();
  if(m(/thank|shukriya|dhanyavaad|धन्यवाद|शुक्रिया/))return R.thanks;
  if(t.length<25&&m(/\b(hi|hello|hey|hii)\b|namaste|नमस्ते/))return R.greet;
  return undefined}
/* ===== general answers: math, date, weather, Wikipedia, small talk ===== */
async function jget(u){const c=new AbortController(),to=setTimeout(()=>c.abort(),9000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(to)}}
const NET={en:'I could not reach the internet for that. Please check your connection and ask again.',hi:'इसके लिए मैं इंटरनेट तक नहीं पहुँच पाया। कनेक्शन देखकर फिर पूछिए।',hn:'Iske liye main internet tak nahi pahunch paya. Connection check karke phir poochiye.'};
const NOTFOUND={en:'I could not find a clear answer for that. Try asking with a simpler name or topic.',hi:'मुझे इसका साफ़ जवाब नहीं मिला। सरल नाम या विषय के साथ पूछिए।',hn:'Mujhe iska saaf jawab nahi mila. Simple naam ya topic ke saath poochiye.'};
function calcAns(t){const rest=t.replace(/plus|minus|times|multiply|multiplied|divided|divide|into|jodo|ghatao|gunaa|guna|bhaag|calculate|calc|kitna|kitne|hota|hoga|hai|equals|equal|what|is|batao|answer|solve|add|subtract|by|\?|=|[0-9+\-*/().,%x×÷\s]|[ऀ-ॿ]+/g,'');if(rest.length)return null;
  let e=t.replace(/,/g,'').replace(/\b(plus|jodo|add)\b|जोड़/g,'+').replace(/\b(minus|ghatao|subtract)\b|घटा/g,'-').replace(/\b(times|multiply|multiplied by|gunaa|guna|into)\b|×|\bx\b|गुणा/g,'*').replace(/\b(divided by|divide|bhaag|by)\b|÷|भाग/g,'/');
  e=e.replace(/[^0-9+\-*/().\s]/g,' ').replace(/\s+/g,' ').trim();if(!/\d/.test(e)||!/[+*/]|\d\s*-\s*\d/.test(e)||!/^[\d+\-*/().\s]+$/.test(e)||e.length>60)return null;
  try{const v=Function('"use strict";return ('+e+')')();if(typeof v!=='number'||!isFinite(v))return null;const s=`${e} = ${+v.toFixed(6)}`;return{en:s,hi:s,hn:s}}catch(x){return null}}
function dateAns(){const d=new Date(),s=d.toLocaleDateString(lang()==='hi'?'hi-IN':'en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});return{en:`Today is ${s}.`,hi:`आज ${s} है।`,hn:`Aaj ${s} hai.`}}
const JOKES=[{en:'Why did the banana go to the doctor? It was not peeling well.',hi:'केला डॉक्टर के पास क्यों गया? क्योंकि उसकी तबीयत छिल रही थी।',hn:'Kela doctor ke paas kyun gaya? Kyunki uski tabiyat "peel" nahi ho rahi thi.'},
 {en:'I told my diet I would start tomorrow. It has been waiting patiently for years.',hi:'मैंने डाइट से कहा कल से शुरू करूँगा। वह सालों से सब्र से इंतज़ार कर रही है।',hn:'Maine diet se kaha kal se shuru karunga. Wo saalon se sabr se intezaar kar rahi hai.'},
 {en:'Why do dals never win arguments? They always get cooked in the end.',hi:'दाल बहस क्यों नहीं जीतती? क्योंकि आख़िर में गल ही जाती है।',hn:'Dal behes kyun nahi jeetti? Kyunki aakhir me gal hi jaati hai.'}];
const WX=c=>c===0?{en:'clear sky',hi:'साफ़ आसमान',hn:'saaf aasmaan'}:c<=3?{en:'partly cloudy',hi:'आंशिक बादल',hn:'thode badal'}:c<=48?{en:'foggy',hi:'कोहरा',hn:'kohra'}:c<=57?{en:'light drizzle',hi:'हल्की बूँदाबाँदी',hn:'halki boondabandi'}:c<=67?{en:'rain',hi:'बारिश',hn:'baarish'}:c<=77?{en:'snow',hi:'बर्फ़बारी',hn:'barfbaari'}:c<=82?{en:'rain showers',hi:'बौछारें',hn:'baucharein'}:{en:'thunderstorm',hi:'आंधी-तूफ़ान',hn:'aandhi-toofan'};
async function weatherAns(raw){const c=raw.toLowerCase().replace(/weather|mausam|मौसम|temperature|tapman|तापमान|kaisa|kaise|kya|hai|today|aaj|आज|how|is|the|what|in|mein|में|\bme\b|\bka\b|\bki\b|का|की|\?/g,' ').replace(/\s+/g,' ').trim();
  if(!c)return{en:'Which city? Ask like "weather in Mumbai".',hi:'कौन सा शहर? ऐसे पूछिए: "मुंबई का मौसम"।',hn:'Kaun sa shehar? Aise poochiye: "Mumbai ka mausam".'};
  const g=await jget(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(c)}&count=1`),r=g.results&&g.results[0];
  if(!r)return{en:`I could not find the city "${c}".`,hi:`मुझे शहर "${c}" नहीं मिला।`,hn:`Mujhe shehar "${c}" nahi mila.`};
  const f=await jget(`https://api.open-meteo.com/v1/forecast?latitude=${r.latitude}&longitude=${r.longitude}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&timezone=auto`),k=f.current,w=WX(k.weather_code);
  return{en:`${r.name}: ${k.temperature_2m}°C, ${w.en}, humidity ${k.relative_humidity_2m}%, wind ${k.wind_speed_10m} km/h.`,hi:`${r.name}: ${k.temperature_2m}°C, ${w.hi}, नमी ${k.relative_humidity_2m}%, हवा ${k.wind_speed_10m} किमी/घंटा।`,hn:`${r.name}: ${k.temperature_2m}°C, ${w.hn}, humidity ${k.relative_humidity_2m}%, hawa ${k.wind_speed_10m} km/h.`}}
const FILLER=/\b(please|plz|tell me|batao|bataiye|bataao|mujhe|muje|about|ke baare mein|ke bare me|what is|what's|who is|who was|who are|what are|kya hai|kya hota hai|kya hoti hai|kaun hai|kaun tha|kaun thi|kise kehte hain|meaning of|meaning|explain|define|the|an?|of|is|are|hai|hain|ka|ki|ke)\b|[?!.]|क्या है|कौन है|कौन था|के बारे में|बताओ|बताइए|मुझे/gi;
async function wikiAns(raw){const q=raw.replace(FILLER,' ').replace(/\s+/g,' ').trim();if(q.length<2)return NOTFOUND;
  const dev=/[ऀ-ॿ]/.test(q),order=(dev||lang()==='hi')?['hi','en']:['en'];
  try{for(const wl of order){const s=await jget(`https://${wl}.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(q)}&limit=1&format=json&origin=*`),title=s[1]&&s[1][0];if(!title)continue;
      const j=await jget(`https://${wl}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`),ex=(j.extract||'').trim();if(!ex)continue;
      const sent=ex.match(/[^.!?।]+[.!?।]+/g)||[ex];let out='';for(const x of sent){if(out&&(out+x).length>380)break;out+=x}
      return out.trim()+'\n('+T({en:'Source: Wikipedia. It may not cover the latest news.',hi:'स्रोत: विकिपीडिया। इसमें ताज़ा ख़बरें न हों।',hn:'Source: Wikipedia. Isme latest news na ho sakti hai.'})+')'}
    return NOTFOUND}catch(e){return NET}}
async function reply(raw){const t=raw.toLowerCase(),m=r=>r.test(t);
  const a=appReply(t);if(a!==undefined)return a;
  const c=calcAns(t);if(c)return c;
  if(m(/\b(date|tarikh|which day|what day)\b|तारीख|कौन सा दिन/))return dateAns();
  if(m(/weather|mausam|मौसम|temperature|tapman|तापमान/)){try{return await weatherAns(raw)}catch(e){return NET}}
  if(m(/joke|chutkula|चुटकुला|hasao|हँसा/))return JOKES[Math.floor(Math.random()*JOKES.length)];
  if(m(/kaise ho|how are you|कैसे हो|kya haal|क्या हाल/))return{en:'I am running at full power, {n}. How are you?',hi:'मैं पूरी ऊर्जा में हूँ, {n}। आप कैसे हैं?',hn:'Main full power me hoon, {n}. Aap kaise hain?'};
  if(m(/what can you do|kya kar sakte|क्या कर सकते|help|madad/))return{en:'I plan your daily and weekly diet, track your progress, and answer questions: health, math, weather, date and time, and general topics when the internet is on.',hi:'मैं आपकी डेली और वीकली डाइट बनाता हूँ, प्रगति याद रखता हूँ, और सवालों के जवाब देता हूँ: सेहत, गणित, मौसम, तारीख़-समय और इंटरनेट चालू होने पर सामान्य विषय।',hn:'Main aapki daily aur weekly diet banata hoon, progress yaad rakhta hoon, aur sawalon ke jawab deta hoon: health, math, mausam, date-time aur internet on ho to general topics.'};
  return await wikiAns(raw)}
async function osend(){const i=$('#oin'),t=i.value.trim();if(!t)return;i.value='';bubble('u',t,$('#olog'));const th=bubble('j','...',$('#olog'));let r;try{r=await reply(t)}catch(e){r=R.dflt}
  th.remove();if(r){const s=typeof r==='string'?r:T(r);bubble('j',s,$('#olog'));speak(s,true)}}
$('#oin').addEventListener('keydown',e=>{if(e.key==='Enter')osend()});
$('#omic').addEventListener('click',()=>doMic(t=>{$('#oin').value=t;osend()},$('#omic')));

async function toggleSetting(k){const S=DB.settings;
  if(!S[k]){const q={save:{en:'Allow Jarvis to save your data on this device?',hi:'क्या जार्विस आपका डेटा इस डिवाइस पर सहेज सकता है?',hn:'Kya Jarvis aapka data is device par save kar sakta hai?'},voice:{en:'Allow Jarvis to speak replies aloud?',hi:'क्या जार्विस जवाब बोलकर सुना सकता है?',hn:'Kya Jarvis jawab bolkar suna sakta hai?'},sound:{en:'Allow Jarvis sound effects?',hi:'क्या जार्विस साउंड इफ़ेक्ट्स चला सकता है?',hn:'Kya Jarvis sound effects chala sakta hai?'},mic:{en:'Allow Jarvis to try using your microphone?',hi:'क्या जार्विस आपका माइक्रोफ़ोन इस्तेमाल करने की कोशिश कर सकता है?',hn:'Kya Jarvis aapka microphone use karne ki koshish kar sakta hai?'},roam:{en:'Allow Jarvis to move around the screen on its own?',hi:'क्या जार्विस स्क्रीन पर अपने आप घूम सकता है?',hn:'Kya Jarvis screen par apne aap ghoom sakta hai?'}}[k];
    if(!await askPermission(q))return;S[k]=true;if(k==='sound')sfx('confirm');if(k==='voice')speak(T({en:'Voice online.',hi:'आवाज़ चालू है।',hn:'Voice online.'}),true)}
  else S[k]=false;
  save();applyStatic();renderSet()}
function act(a,b){const[k,v]=a.split(':');
  switch(k){
   case'activate':return activate();
   case'go':return go(v);
   case'daily':return runFlow(dailyFlow);
   case'weekly':return runFlow(weeklyFlow);
   case'pv':PV=v;return renderPlan();
   case'wd':WSEL=+v;return renderPlan();
   case'tog':return toggleSetting(v);
   case'lang':DB.profile.lang=v;save();applyStatic();return renderSet();
   case'gender':DB.profile.gender=v;save();orbInit();return renderSet();
   case'savename':{const n=$('#sname').value.trim().slice(0,30);if(n){DB.profile.name=n;save();toast(T({en:'Name saved.',hi:'नाम सहेजा गया।',hn:'Name save ho gaya.'}))}return}
   case'vtest':if(!DB.settings.voice){toast(T({en:'Turn Voice ON first.',hi:'पहले आवाज़ ON करें।',hn:'Pehle Voice ON karein.'}));return}speak(T({en:'Hello {n}. This is how I sound.',hi:'नमस्ते {n}। मेरी आवाज़ ऐसी है।',hn:'Hello {n}. Meri awaaz aisi hai.'}),true);return;
   case'orbshow':return showOrb();
   case'orbhide':return hideOrb();
   case'orbclose':return togglePanel(false);
   case'osend':return osend();
   case'bkcopy':{const code=b64e(JSON.stringify(DB));const ta=$('#bkin');ta.value=code;ta.select();
     (navigator.clipboard?.writeText(code)||Promise.reject()).then(()=>toast(T({en:'Backup code copied.',hi:'बैकअप कोड कॉपी हुआ।',hn:'Backup code copy ho gaya.'}))).catch(()=>toast(T({en:'Select the code above and copy it.',hi:'ऊपर का कोड चुनकर कॉपी करें।',hn:'Upar ka code select karke copy karein.'})));return}
   case'bkrestore':{try{const o=JSON.parse(b64d($('#bkin').value));if(!o.profile||!o.days||!o.settings)throw 0;DB=o;save();applyStatic();orbInit();go('home');toast(T({en:'Backup restored.',hi:'बैकअप रीस्टोर हुआ।',hn:'Backup restore ho gaya.'}))}catch(e){sfx('err');toast(T({en:'That backup code is not valid.',hi:'यह बैकअप कोड सही नहीं है।',hn:'Ye backup code sahi nahi hai.'}))}return}
   case'erase1':$('#erase').innerHTML=`<button class="btn bad" data-act="erase2">${esc(T({en:'Yes, erase everything',hi:'हाँ, सब मिटाएँ',hn:'Haan, sab mitayein'}))}</button><button class="btn" data-act="go:set">${esc(T({en:'Cancel',hi:'रद्द करें',hn:'Cancel'}))}</button>`;return;
   case'erase2':{abortFlow();try{localStorage.removeItem(KEY)}catch(e){}DB=fresh();memDB=null;$('#olog').innerHTML='';applyStatic();orbInit();boot();return}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b)});

/* ===== boot ===== */
function boot(){$('#boot').hidden=false;$('#bootbtn').textContent=DB.profile?.done?T({en:'Activate',hi:'सक्रिय करें',hn:'Activate'}):'Activate'}
async function activate(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}ac();sfx('boot');$('#boot').hidden=true;
  if(DB.profile?.done){applyStatic();orbInit();go('home');
    const t=T({en:'Welcome back, {n}. Systems online. What shall we plan today?',hi:'वापसी पर स्वागत है, {n}। सिस्टम चालू हैं। आज क्या प्लान करें?',hn:'Welcome back, {n}. Systems online hain. Aaj kya plan karein?'});
    speak(t,true);toast(t)}
  else{applyStatic();runFlow(onboard)}}
$('#bootlogo').innerHTML=reactor(150);$('#barlogo').innerHTML=reactor(28);
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{if(view==='set')renderSet()};document.addEventListener('change',e=>{if(e.target.id==='vsel'){DB.settings.voiceURI=e.target.value||null;save()}});
applyStatic();orbInit();if(DB.profile?.done)go("home");boot();
</script>
